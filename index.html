<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b0919" />
    <title>Experience Taaffeite Origin</title>
    <meta
      name="description"
      content="Enter Taaffeite Origin, an archive of exceptional gemstones from Sri Lanka and beyond."
    />
    <link rel="icon" type="image/png" href="assets/taaffeite-origin-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&amp;family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&amp;display=swap" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="experience-page">
    <main class="experience-screen">
      <video
        class="experience-video"
        muted
        loop
        playsinline
        preload="auto"
        aria-hidden="true"
        poster="assets/taaffeite-hero.png"
      >
        <source src="assets/video/taaffeite-intro.mp4" type="video/mp4" />
      </video>
      <div class="experience-shade" aria-hidden="true"></div>
      <div class="experience-content">
        <img
          class="experience-logo"
          src="assets/taaffeite-origin-logo.png"
          alt="Taaffeite Origin"
          fetchpriority="high"
        />
        <p class="experience-kicker">An archive of exceptional stones</p>
        <a class="experience-enter" href="home.html">
          <span>Experience Taaffeite Origin</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M4.5 12h14m-6-6 6 6-6 6" />
          </svg>
        </a>
      </div>
      <span class="experience-location">Sri Lanka · Est. 2026</span>
    </main>
    <script>
      const intro = document.querySelector(".experience-video");
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        intro.play().catch(() => {});
      }
    </script>
  </body>
</html>
